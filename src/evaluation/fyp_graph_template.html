<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMA · 图谱与来源</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f7;color:#173442;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:24px max(22px,calc((100vw - 1420px)/2));background:#183342;color:white}h1{margin:0;font-size:27px}header p{margin:4px 0;color:#bdd4dc}main{max-width:1460px;margin:auto;padding:22px}.notice{background:#fff4df;padding:12px 18px;border-left:4px solid #ad7317;margin-bottom:18px}a{color:#146d5c}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #d4e1e4;border-radius:10px;padding:18px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:15px 0 7px}.muted{color:#58737d;font-size:13px}input,select,button{font:inherit;border:1px solid #bbccd2;border-radius:6px;background:white;padding:8px;max-width:100%}input{width:100%}button{cursor:pointer;color:#193e4b}button:hover,button.selected{background:#e8f5f0;border-color:#257b68}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #428dad;outline-offset:2px}label{display:block;font-size:13px;margin:9px 0 4px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.filters label{margin:0}.filters select{display:block}.item{display:block;width:100%;text-align:left;margin:8px 0;overflow-wrap:anywhere}.item small{display:block;color:#58737d}.entities{max-height:760px;overflow:auto}.tag{background:#e9f1f4;border-radius:4px;display:inline-block;padding:3px 7px;margin:3px;font-size:12px}.warn{background:#fff0ce;color:#785111}.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;margin-top:18px}.edges{max-height:850px;overflow:auto}.source{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7f8;padding:14px;border-radius:7px;line-height:1.9;font-family:Georgia,"Microsoft YaHei",serif}blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid #378274;background:#eef6f2;overflow-wrap:anywhere}mark{background:#ffeba5}svg{width:100%;height:520px;background:#f7fafb;border-radius:7px}.node{cursor:pointer}.node text{font:12px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1f3c49}.node circle{fill:#dfefea;stroke:#2a7866;stroke-width:2}.node.center circle{fill:#1b6556}.node.center text{font-weight:700}.link{stroke:#819ba7;stroke-width:1.5;cursor:pointer}.link.conflict{stroke:#b57b26}.link.active{stroke:#146b58;stroke-width:3}footer{font-size:12px;color:#637d86;margin-top:18px}details{border-top:1px solid #d9e5e7;margin-top:12px;padding-top:10px}summary{cursor:pointer} @media(max-width:1000px){.layout,.grid{grid-template-columns:1fr}.entities{max-height:240px}.edges{max-height:300px}svg{height:450px}} @media(max-width:600px){main{padding:12px}.panel{padding:12px}svg{height:360px}}
</style></head><body><header><h1>SMA · 图谱与来源</h1><p id="scope"></p></header><main><div class="notice">这是固定快照的研究图谱。关系与名称合并尚未获得全面人工验证；启发式分数不代表准确率。外部关联按来源标识单独展示。</div><div class="layout"><aside class="panel"><h2>查找实体</h2><label for="search">实体名称或来源标识</label><input id="search" type="search" value="SMN1" placeholder="例如 SMN1、Nusinersen"><label for="type">实体类型</label><select id="type"><option value="">全部类型</option></select><p id="entity-count" class="muted"></p><div id="entities" class="entities"></div></aside><section><div class="panel"><h2 id="center-title">局部图</h2><div class="filters"><label>关系类型<select id="relation"><option value="">全部关系</option></select></label><label>数据来源<select id="source"><option value="">全部来源</option><option value="literature">PubMed 文献</option><option value="opentargets">Open Targets</option></select></label><label>冲突状态<select id="conflict"><option value="">全部状态</option><option value="review">仅潜在冲突</option></select></label><label>可视邻居数<select id="limit"><option>12</option><option>24</option></select></label></div><p id="graph-count" class="muted"></p><svg id="graph" viewBox="0 0 1000 600" role="img" aria-label="有向局部关系图"></svg><p class="muted">箭头表示关系方向；点击实体切换中心，点击线条或下方关系查看证据。邻居按稳定顺序显示，完整匹配关系可在下方逐页查看。</p></div><div class="grid"><section class="panel"><h2>关系列表</h2><div id="edges" class="edges"></div><button id="more" hidden>显示更多关系</button></section><section class="panel"><h2>来源与证据</h2><div id="detail">选择一条关系查看来源。</div></section></div></section></div><footer id="footer"></footer></main>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script><script>
const G=JSON.parse(document.getElementById('graph-data').textContent),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const adjacency=G.nodes.map(()=>[]);G.edges.forEach((e,i)=>{adjacency[e.a].push(i);if(e.b!==e.a)adjacency[e.b].push(i)});let center=null,selected=null,visibleEdges=[],shown=60;
const namespace=n=>n.namespace==='literature'?'文献':'Open Targets';const nodeLabel=i=>G.nodes[i].name+' · '+G.nodes[i].type+' · '+namespace(G.nodes[i]);
$('scope').textContent=G.literature_edge_count.toLocaleString()+' 条文献融合边 · '+G.original_evidence_count.toLocaleString()+' 条原始证据 · '+G.external_edge_count+' 条外部关联';
for(const t of [...new Set(G.nodes.map(n=>n.type))].sort())$('type').add(new Option(t,t));for(const r of [...new Set(G.edges.map(e=>e.relation))].sort())$('relation').add(new Option(r,r));
function findEntities(){const query=$('search').value.trim().toLowerCase(),type=$('type').value;let ids=G.nodes.map((n,i)=>i).filter(i=>(!type||G.nodes[i].type===type)&&(!query||(G.nodes[i].name+' '+G.nodes[i].source_id).toLowerCase().includes(query)));ids.sort((a,b)=>(G.nodes[b].name.toLowerCase()===query)-(G.nodes[a].name.toLowerCase()===query)||G.nodes[a].name.localeCompare(G.nodes[b].name)||a-b);$('entity-count').textContent=ids.length+' 个匹配实体'+(ids.length>80?'；显示前 80 个，请细化查询':'');$('entities').innerHTML=ids.slice(0,80).map(i=>'<button class="item'+(i===center?' selected':'')+'" data-node="'+i+'">'+esc(G.nodes[i].name)+'<small>'+esc(G.nodes[i].type)+' · '+namespace(G.nodes[i])+(G.nodes[i].source_id?' · '+esc(G.nodes[i].source_id):'')+'</small></button>').join('')||'<p>没有匹配实体，请修改检索词或类型。</p>';for(const b of $('entities').querySelectorAll('[data-node]'))b.onclick=()=>chooseNode(Number(b.dataset.node));}
function chooseNode(i){center=i;selected=null;shown=60;findEntities();render();}
function render(){if(center===null)return;visibleEdges=adjacency[center].filter(i=>{const e=G.edges[i];return(!$('relation').value||e.relation===$('relation').value)&&(!$('source').value||e.source===$('source').value)&&(!$('conflict').value||e.needs_review)});$('center-title').textContent=nodeLabel(center);if(!visibleEdges.includes(selected))selected=visibleEdges[0]??null;$('graph-count').textContent=visibleEdges.length+' 条匹配关系；中心实体总关系 '+adjacency[center].length;renderGraph();renderEdges();renderDetail();}
function renderGraph(){const maximum=Number($('limit').value),neighbors=[...new Set(visibleEdges.map(i=>G.edges[i].a===center?G.edges[i].b:G.edges[i].a).filter(i=>i!==center))].slice(0,maximum);let pos=new Map([[center,[500,290]]]);neighbors.forEach((n,k)=>{const angle=2*Math.PI*k/neighbors.length-Math.PI/2;pos.set(n,[500+370*Math.cos(angle),290+235*Math.sin(angle)])});let content='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708f9d"/></marker></defs>';for(const i of visibleEdges){const e=G.edges[i];if(!pos.has(e.a)||!pos.has(e.b))continue;const [x1,y1]=pos.get(e.a),[x2,y2]=pos.get(e.b);if(e.a===e.b){content+='<path class="link'+(e.needs_review?' conflict':'')+(i===selected?' active':'')+'" data-edge="'+i+'" d="M 480 272 C 435 205 560 205 522 272" fill="none" marker-end="url(#arrow)"><title>'+esc(e.relation)+'</title></path>';continue}const distance=Math.hypot(x2-x1,y2-y1),dx=(x2-x1)/distance,dy=(y2-y1)/distance;content+='<line class="link'+(e.needs_review?' conflict':'')+(i===selected?' active':'')+'" data-edge="'+i+'" x1="'+(x1+26*dx)+'" y1="'+(y1+26*dy)+'" x2="'+(x2-30*dx)+'" y2="'+(y2-30*dy)+'" marker-end="url(#arrow)"><title>'+esc(e.relation)+' · '+esc(nodeLabel(e.a))+' → '+esc(nodeLabel(e.b))+'</title></line>'}for(const [i,[x,y]] of pos){const n=G.nodes[i];content+='<g class="node'+(i===center?' center':'')+'" data-node="'+i+'" transform="translate('+x+' '+y+')"><title>'+esc(nodeLabel(i))+'</title><circle r="24"/><text text-anchor="middle" y="42">'+esc(n.name.length>28?n.name.slice(0,26)+'…':n.name)+'</text><text text-anchor="middle" y="58">'+esc(n.type)+'</text></g>'}$('graph').innerHTML=content;for(const b of $('graph').querySelectorAll('[data-node]'))b.onclick=()=>chooseNode(Number(b.dataset.node));for(const b of $('graph').querySelectorAll('[data-edge]'))b.onclick=()=>chooseEdge(Number(b.dataset.edge));}
function renderEdges(){$('edges').innerHTML=visibleEdges.slice(0,shown).map(i=>{const e=G.edges[i];return '<button class="item'+(i===selected?' selected':'')+'" data-edge="'+i+'">'+esc(G.nodes[e.a].name)+' → '+esc(G.nodes[e.b].name)+'<small>'+esc(e.relation)+' · '+(e.source==='literature'?e.pmids.length+' 篇文献':'Open Targets')+(e.needs_review?' · 潜在冲突待审':'')+'</small></button>'}).join('')||'<p>当前筛选没有关系。修改关系类型、来源或冲突状态。</p>';$('more').hidden=shown>=visibleEdges.length;for(const b of $('edges').querySelectorAll('[data-edge]'))b.onclick=()=>chooseEdge(Number(b.dataset.edge));}
function chooseEdge(i){selected=i;renderGraph();renderEdges();renderDetail();}
function highlighted(text,segments,field){const parts=segments.filter(s=>s.field===field).sort((a,b)=>a.start-b.start);let cursor=0,html='';for(const s of parts){if(s.start<cursor||s.end>text.length)continue;html+=esc(text.slice(cursor,s.start))+'<mark>'+esc(text.slice(s.start,s.end))+'</mark>';cursor=s.end}return html+esc(text.slice(cursor));}
const locations={exact:'原文精确定位',normalized:'排版归一定位',ordered_fragments:'按顺序定位片段',not_located:'未能定位',missing_evidence:'缺少证据',missing_source:'缺少来源'};
function renderDetail(){if(selected===null){$('detail').textContent='当前筛选没有关系可查看。';return}const e=G.edges[selected];let html='<h3>'+esc(nodeLabel(e.a))+' → '+esc(nodeLabel(e.b))+'</h3><span class="tag">'+esc(e.relation)+'</span>';if(e.source==='opentargets'){html+='<p>结构化基因—疾病关联，来源为本地 Open Targets 快照。</p><p>Ensembl：'+esc(e.target_id)+'<br>疾病：'+esc(e.disease_id)+'<br>来源关联分数：'+esc(e.score)+'（不等于关系正确率）</p><a target="_blank" rel="noopener" href="https://platform.opentargets.org/target/'+encodeURIComponent(e.target_id)+'/associations">打开 Open Targets</a><p class="muted">此快照没有 PMID 或文献证据片段；不伪造 PubMed 来源。外部节点按来源标识单独保留。</p>';$('detail').innerHTML=html;return}html+='<p>'+e.records.length+' 条抽取记录 · '+e.pmids.length+' 个不同 PMID</p><p class="muted">启发式融合分数 '+esc(e.confidence)+'；尚非人工确认的事实。</p>';if(e.needs_review){const parallel=G.edges.filter(x=>x.source==='literature'&&x.a===e.a&&x.b===e.b&&x.needs_review);html+='<div class="notice">潜在相反极性待审：'+esc([...new Set(parallel.map(x=>x.relation))].join('、'))+'。可能来自不同条件、抽取或对齐错误，尚未裁决。</div>'}for(const [k,r] of e.records.entries()){const s=G.sources[r.pmid],v=r.validation;html+='<details'+(k===0?' open':'')+'><summary>PMID '+esc(r.pmid)+' · 原始记录 '+r.raw_record_number+'</summary><h3>'+esc(s.title||'标题未存储')+'</h3><a href="https://pubmed.ncbi.nlm.nih.gov/'+encodeURIComponent(r.pmid)+'/" target="_blank" rel="noopener">打开 PubMed 原文来源</a><p class="muted">抽取时实体：'+esc(r.original_entity_1.name)+' ('+esc(r.original_entity_1.type)+') → '+esc(r.original_entity_2.name)+' ('+esc(r.original_entity_2.type)+')</p><blockquote>'+esc(r.span)+'</blockquote><span class="tag">'+esc(locations[v.location_status]||v.location_status)+'</span><span class="tag'+(v.eligible_span?'':' warn')+'">'+(v.eligible_span?'可追溯候选，语义未验证':'证据筛查建议送审')+'</span><p class="muted">黄色只标出已定位片段，不代表该关系正确。</p><div class="source">'+highlighted(s.abstract,v.segments,'abstract')+'</div>';if(r.assertion_quality){const q=r.assertion_quality;html+='<h3>完整原句与条件审核</h3><p class="muted">'+esc(q.flags.join('；')||'规则筛查通过；仍未获得语义或人工验证。')+'</p>';for(const c of q.context_sentences)html+='<blockquote>'+esc(c.text)+'</blockquote><p class="muted">'+esc(c.field)+' ['+c.start+', '+c.end+') · '+esc(c.scope_cues.join('、'))+'</p>';}html+='</details>'}$('detail').innerHTML=html;}
$('search').oninput=findEntities;$('type').onchange=findEntities;for(const id of ['relation','source','conflict','limit'])$(id).onchange=()=>{shown=60;render()};$('more').onclick=()=>{shown+=60;renderEdges()};$('footer').textContent='运行 '+G.run+' · 文献节点按名称＋类型区分，外部来源单独命名；与当前类型化数据库按同一来源命名空间对照；历史数据库另行保留。所有数据和样式已内嵌，查看来源外链需联网。';findEntities();const initial=G.nodes.findIndex(n=>n.name==='SMN1'&&n.type==='Gene'&&n.namespace==='literature');if(initial>=0)chooseNode(initial);
</script></body></html>

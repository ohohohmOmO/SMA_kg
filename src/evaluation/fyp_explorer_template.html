<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMA · 证据与评价</title>
<style>
:root{--ink:#162f40;--muted:#56707a;--line:#d8e3e5;--green:#146857;--bg:#f3f7f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#122e3d;color:white;padding:27px max(24px,calc((100vw - 1320px)/2));}header h1{font-size:28px;margin:0}header p{margin:5px 0;color:#bdd5dd}.wrap{max-width:1320px;margin:auto;padding:24px}.notice{padding:14px 20px;border-left:4px solid #b57512;background:#fff5df;border-radius:4px;margin-bottom:20px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 15px;border-radius:7px}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4f96b9;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{border:1px solid var(--line);border-radius:10px;background:white;padding:20px}.card strong{display:block;font-size:32px}.muted{color:var(--muted)}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px;margin:18px 0 8px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}th{font-size:13px;color:var(--muted);background:#f5f8f8}.scroll{overflow:auto}.browser{display:grid;grid-template-columns:330px 1fr;gap:18px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{border:1px solid #bdced3;border-radius:6px;background:white;padding:9px;max-width:100%}input[type=search]{flex:1;min-width:240px}textarea{width:100%;min-height:80px}.list{max-height:700px;overflow:auto}.item{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:13px}.item strong{display:block;font-size:14px}.item.selected{border-color:var(--green);background:#edf6f1}.tag{display:inline-block;padding:3px 8px;border-radius:5px;background:#e9f2f5;color:#255969;font-size:12px;margin:3px 5px 3px 0}.source{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-family:Georgia,"Microsoft YaHei",serif;background:#f6f9f9;padding:16px;border-radius:7px}mark{background:#ffedab;padding:1px 0}.quote{border-left:3px solid #4a8b80;padding:10px 16px;background:#eff7f4;overflow-wrap:anywhere}a{color:var(--green)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stage{margin-top:17px}.stage span{display:inline-block;background:#edf3f4;padding:6px 10px;margin:4px;border-radius:5px}.hidden{display:none}.help{font-size:13px;color:var(--muted)}.progress{padding:10px;background:#edf5f2;border-radius:5px;margin:12px 0}.diagram{width:100%;height:135px}footer{padding:18px 0;color:var(--muted);font-size:12px}label{display:block;font-size:13px;font-weight:600;margin-top:13px}label select{display:block;margin-top:5px;width:100%}@media(max-width:850px){.grid{grid-template-columns:1fr}.browser{grid-template-columns:1fr}.list{max-height:250px}.wrap{padding:15px}header{padding:22px}.diagram{height:160px}}
</style></head><body><header><h1>SMA · 证据与评价</h1><p>固定输入、可追溯来源、可复现对照</p></header><main class="wrap"><div id="notice" class="notice"></div><nav><button id="tab-summary" class="active">结果总览</button><button id="tab-evidence">证据浏览</button><button id="tab-fusion">融合审核 · 30 项</button></nav>
<section id="summary"><div class="grid" id="cards"></div><div class="panel stage"><h2>当前交付状态</h2><div id="stages"></div><p class="help">关系支持、证据片段合格、实体合并正确是三项不同判断。页面不提供临床决策建议。</p></div><div class="panel stage"><h2>融合对照 · 文献图谱</h2><div class="scroll" id="fusion-table"></div><p class="help">节点按名称＋类型区分；边按实体、类型和关系区分。压缩效果不等于融合正确率。</p></div><div class="panel stage"><h2>证据筛查 · 主随机集内部测试</h2><div class="scroll" id="gate-table"></div><p class="help">“参考合格比例”表示保留片段中，参考标签为合格的比例，不是整个知识图谱的准确率。被送审的记录仍保留。此测试是回顾性内部评价。</p></div></section>
<section id="evidence" class="hidden"><div class="filters"><input id="search" type="search" placeholder="搜索实体、PMID、标题、候选 ID" aria-label="搜索候选"><select id="group" aria-label="样本分组"><option value="all">全部分组</option><option value="primary_random">随机主集</option><option value="challenge">挑战集</option></select><select id="support" aria-label="关系参考标签"><option value="all">全部关系标签</option><option value="2">2 · 直接支持</option><option value="1">1 · 部分支持</option><option value="0">0 · 不支持</option></select><select id="state" aria-label="证据筛查状态"><option value="all">全部筛查状态</option><option value="needs_review">需要复核</option><option value="traceable_candidate">可追溯候选</option><option value="not_located">未定位</option></select></div><div class="browser"><aside class="panel"><p id="found" class="help"></p><div id="candidate-list" class="list"></div></aside><article id="candidate-detail" class="panel"></article></div></section>
<section id="fusion" class="hidden"><div class="row"><label>实际审核者代号 <input id="reviewer" placeholder="如 Student01" autocomplete="off"></label><button id="export" class="primary">导出已审核记录 JSON</button><button id="show-export">显示导出内容</button></div><p class="help">每项只判断名称是否指向同一个实体；未发生变化的步骤显示“未改变”。不同／无法判断请补一句原因。保存只记录你的选择，不会沿用 AI 标签。</p><textarea id="review-export" class="hidden" readonly aria-label="审核导出JSON"></textarea><div id="fusion-progress" class="progress"></div><div class="browser"><aside class="panel"><div id="fusion-list" class="list"></div></aside><article id="fusion-detail" class="panel"></article></div><p id="save-status" role="status" class="help"></p></section>
<footer id="footer"></footer></main><script>
'use strict';
const DATA=__DATA__;
const $=id=>document.getElementById(id), pct=v=>v==null?'未评价':(100*v).toFixed(1)+'%';
const flagNames={missing_source:'找不到来源快照',missing_evidence:'未提供证据片段',not_located:'未能对应原文',ellipsis_context_requires_review:'省略片段之间的上下文需要核对',missing_endpoint_in_span:'片段未覆盖两个实体',short_fragment:'片段过短',no_predicate_cue:'未识别到关系表达线索',negation_requires_review:'原句含否定词，需要核对',uncertainty_requires_review:'原句含不确定表达，需要核对',experimental_context_requires_review:'包含实验对象或条件，需要核对'};
const locationNames={exact:'原文精确定位',normalized:'格式归一后定位',ordered_fragments:'按顺序定位省略片段',not_located:'未定位',missing_source:'缺少来源',missing_evidence:'缺少片段'};
const spanNames={yes:'合格',no:'不合格',unclear:'无法判断'};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function table(target,headers,rows){const t=el('table'),head=el('tr');headers.forEach(h=>head.append(el('th',h)));t.append(head);rows.forEach(row=>{const tr=el('tr');row.forEach(v=>tr.append(el('td',String(v))));t.append(tr)});$(target).replaceChildren(t);}
const confirmed=DATA.review.provenance.mode==='human_confirmed_all';
$('notice').textContent=confirmed?'用户已确认全部 400 条均为人工标记，ChatGPT 仅整理表格；原始表格元数据保留。独立第二评审与融合映射质量仍未提供。':'工作簿标签注明 AI 辅助评审，实际人工确认范围尚待核实。以下质量数字是参考标签统计，不能作为独立人工金标准结果。';
const main=DATA.review.reference_statistics.primary_random;
[['随机主集严格支持',pct(main.strict_support),'n = '+main.n+'，部分支持单列'],['文献融合关系边',DATA.fusion.conditions.semantic.unique_relation_edges,'18,288 条原始证据保留'],['已填写参考标签',DATA.rows.length,'第二评审一致性：未评价']].forEach(([name,value,note])=>{const c=el('div',undefined,'card');c.append(el('div',name,'muted'),el('strong',String(value)),el('div',note,'help'));$('cards').append(c)});
['目标与指标：已定义','审核材料：已核验；人工范围'+(confirmed?'已确认':'待确认'),'融合对照：已运行；语义判断待补','证据定位与筛查：已实现并评价','结果与讨论：草稿已生成'].forEach(x=>$('stages').append(el('span',x)));
const labels={raw:'原始名称',dictionary:'字典归一',semantic:'字典＋语义'};
table('fusion-table',['条件','类型化节点','唯一关系边','潜在冲突对','最大分量之外'],Object.entries(DATA.fusion.conditions).map(([k,v])=>[labels[k],v.typed_nodes,v.unique_relation_edges,v.conflict_pairs,pct(v.outside_largest_component_fraction)]));
const gates=DATA.evidence.groups['primary_random:test'], gateNames={nonempty:'非空基线',literal:'精确定位',traceable:'扩展定位',triage_gate:'保守筛查'};
table('gate-table',['规则','保留数 / 测试数','保留率','参考合格比例','合格片段检出率'],Object.entries(gates).map(([k,v])=>[gateNames[k],v.retained+' / '+v.n,pct(v.retention),pct(v.span_positive_predictive_value),pct(v.adequate_span_sensitivity)]));
['summary','evidence','fusion'].forEach(id=>$('tab-'+id).onclick=()=>{['summary','evidence','fusion'].forEach(x=>{$(x).classList.toggle('hidden',x!==id);$('tab-'+x).classList.toggle('active',x===id)})});
let selected=null;
function highlighted(text,segments,field){const box=el('div',undefined,'source');let cursor=0;const ranges=segments.filter(s=>s.field===field).sort((a,b)=>a.start-b.start);for(const s of ranges){if(s.start<cursor)continue;box.append(document.createTextNode(text.slice(cursor,s.start)),el('mark',text.slice(s.start,s.end)));cursor=s.end}box.append(document.createTextNode(text.slice(cursor)));return box;}
function showCandidate(r){selected=r.candidate_id;const box=$('candidate-detail');box.replaceChildren(el('h2',r.candidate_id));const tags=el('div');[r.sample_group,'PMID '+r.source_pmid,'关系参考 '+r.support_label,'证据参考 '+spanNames[r.span_label],locationNames[r.validation.location_status]].forEach(t=>tags.append(el('span',t,'tag')));box.append(tags,el('h3',r.title));const link=el('a','打开 PubMed 来源');link.href='https://pubmed.ncbi.nlm.nih.gov/'+encodeURIComponent(r.source_pmid)+'/';link.target='_blank';link.rel='noopener noreferrer';box.append(link);box.append(el('div',r.entity_1_name+' ['+r.entity_1_type+'] → '+r.relation+' → '+r.entity_2_name+' ['+r.entity_2_type+']','quote'),el('h3','提供的证据片段'),el('div',r.evidence_text,'quote'),el('h3','原始摘要 · 高亮为可定位片段'),highlighted(r.abstract,r.validation.segments,'abstract'));if(r.validation.segments.some(s=>s.field==='title'))box.append(el('h3','标题中的位置'),highlighted(r.title,r.validation.segments,'title'));box.append(el('h3','自动复核原因'),el('p',r.validation.flags.map(f=>flagNames[f]||f).join('；')||'满足词面筛查条件；语义支持尚未验证。'));if(r.validation.suggestion)box.append(el('h3','模糊定位建议 · 不作为自动接受依据'),el('div',r.validation.suggestion.text,'quote'));box.append(el('h3','参考评审记录'),el('p',r.review_notes||'无备注'),el('p','启发式置信分数：'+r.computed_confidence+'；不是测量准确率。','help'));document.querySelectorAll('#candidate-list button').forEach(b=>b.classList.toggle('selected',b.dataset.id===selected));}
function filterCandidates(){const q=$('search').value.trim().toLowerCase();const rows=DATA.rows.filter(r=>($('group').value==='all'||r.sample_group===$('group').value)&&($('support').value==='all'||r.support_label===$('support').value)&&($('state').value==='all'||r.validation.triage===$('state').value||r.validation.location_status===$('state').value)&&(!q||[r.candidate_id,r.source_pmid,r.title,r.entity_1_name,r.entity_2_name].join(' ').toLowerCase().includes(q)));$('found').textContent=rows.length+' 条匹配记录';$('candidate-list').replaceChildren();rows.forEach(r=>{const b=el('button',undefined,'item');b.dataset.id=r.candidate_id;b.append(el('strong',r.candidate_id+' · '+r.source_pmid),el('span',r.entity_1_name+' → '+r.entity_2_name));b.onclick=()=>showCandidate(r);$('candidate-list').append(b)});if(rows.length)showCandidate(rows.find(r=>r.candidate_id===selected)||rows[0]);else $('candidate-detail').replaceChildren(el('p','没有匹配记录，请调整筛选条件。'));}
['search','group','support','state'].forEach(id=>$(id).addEventListener('input',filterCandidates));filterCandidates();
let reviews={},fusionSelected=DATA.fusion_queue[0]?.review_id;const storageKey='sma-fusion-'+DATA.queue_hash;
try{reviews=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){$('save-status').textContent='本浏览器无法持久保存，请每次审核后立即导出。'}
function selectJudgment(label,id,unchanged){const wrap=el('label',label),s=el('select');s.id=id;[['','请选择'],['same','同一实体'],['different','不同实体'],['unclear','无法判断']].forEach(([v,t])=>{const o=el('option',t);o.value=v;s.append(o)});if(unchanged){s.replaceChildren(el('option','未改变'));s.firstChild.value='not_changed';s.disabled=true;}wrap.append(s);return wrap;}
function fusionProgress(){$('fusion-progress').textContent='已保存 '+Object.keys(reviews).length+' / '+DATA.fusion_queue.length+' 项；导出后才形成可提交的审核材料。';document.querySelectorAll('#fusion-list button').forEach(b=>{b.classList.toggle('selected',b.dataset.id===fusionSelected);b.textContent=b.dataset.id+(reviews[b.dataset.id]?' · 已保存':' · 待审')})}
function showFusion(r){fusionSelected=r.review_id;const box=$('fusion-detail');box.replaceChildren(el('h2',r.review_id+' · '+r.entity_type),el('div',r.raw_name+' → '+r.dictionary_name+' → '+r.aligned_name,'quote'));r.source_contexts.forEach(c=>box.append(el('h3','PMID '+c.pmid+' · '+c.title),el('div',c.abstract,'source')));box.append(selectJudgment('字典步骤：原始名称与字典名称是否同一实体？','dict-answer',r.raw_name===r.dictionary_name),selectJudgment('语义步骤：字典名称与对齐名称是否同一实体？','semantic-answer',r.dictionary_name===r.aligned_name));const noteLabel=el('label','理由（不同或无法判断时必填）'),notes=el('textarea');notes.id='fusion-notes';noteLabel.append(notes);box.append(noteLabel);const saved=reviews[r.review_id];if(saved){$('dict-answer').value=saved.dictionary_judgment;$('semantic-answer').value=saved.semantic_judgment;notes.value=saved.notes;$('reviewer').value=saved.reviewer_id;}const save=el('button','保存这项审核','primary');save.style.marginTop='12px';save.onclick=()=>{const reviewer=$('reviewer').value.trim(),d=$('dict-answer').value,s=$('semantic-answer').value,n=notes.value.trim();if(!reviewer||!d||!s||([d,s].some(v=>v==='different'||v==='unclear')&&!n)){$('save-status').textContent='请填写审核者、两个有效选择，以及必要的判定理由。';return;}reviews[r.review_id]={review_id:r.review_id,entity_type:r.entity_type,raw_name:r.raw_name,dictionary_name:r.dictionary_name,aligned_name:r.aligned_name,dictionary_judgment:d,semantic_judgment:s,reviewer_id:reviewer,review_date:new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}),notes:n};try{localStorage.setItem(storageKey,JSON.stringify(reviews));$('save-status').textContent='已保存 '+r.review_id+'；请导出备份。'}catch(e){$('save-status').textContent='仅保存在当前页面内存，请立即导出。'}fusionProgress();};box.append(save);fusionProgress();}
DATA.fusion_queue.forEach(r=>{const b=el('button',r.review_id,'item');b.dataset.id=r.review_id;b.onclick=()=>showFusion(r);$('fusion-list').append(b)});if(DATA.fusion_queue.length)showFusion(DATA.fusion_queue[0]);
$('export').onclick=()=>{if(!Object.keys(reviews).length){$('save-status').textContent='还没有已保存的审核记录。';return;}const data={schema:'sma_fusion_review_v1',fusion_queue_sha256:DATA.queue_hash,reviews:Object.values(reviews)};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download='SMA融合审核_30项.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('show-export').onclick=()=>{if(!Object.keys(reviews).length){$('save-status').textContent='还没有已保存的审核记录。';return;}const data={schema:'sma_fusion_review_v1',fusion_queue_sha256:DATA.queue_hash,reviews:Object.values(reviews)};$('review-export').value=JSON.stringify(data,null,2);$('review-export').classList.remove('hidden');$('review-export').focus();$('review-export').select();$('save-status').textContent='导出内容已显示并选中；可复制到聊天，或另存为 UTF-8 JSON 文件。';};
$('footer').textContent='运行：'+DATA.run_name+' · 来源工作簿 SHA-256：'+DATA.workbook_hash+' · 页面内嵌数据，离线可用。';
</script></body></html>
